name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  javascript:
    name: Editors and installers (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Check shell syntax
        run: bash -n install.sh scripts/*.sh bin/promptlang-*
      - name: Check generated preview
        run: |
          node scripts/render-preview.mjs
          git diff --exit-code -- docs/assets
